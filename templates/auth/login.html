{% extends "base.html" %}
{% block title %}UR RECORDS{% endblock %}

{% block content %}
<div class="auth-box card" style="max-width:420px; margin:28px auto;">
    <h1 style="margin-bottom:14px;">UR RECORDS</h1>

    <form method="POST" action="{{ url_for('auth.login') }}">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required>

        <label>Name</label>
        <input type="text" name="full_name" autocomplete="name" required>

        <button type="submit" class="btn" style="width:100%; margin-top:6px;">Continue</button>
    </form>
</div>
{% endblock %}
